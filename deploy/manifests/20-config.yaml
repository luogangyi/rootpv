apiVersion: v1
kind: ConfigMap
metadata:
  name: persistent-rootfs-webhook-config
  namespace: rootpv-system
  labels:
    app.kubernetes.io/name: persistent-rootfs
    app.kubernetes.io/part-of: rootpv
data:
  storagePolicy.yaml: |
    allowStorageClasses:
    - ""
    - rootpv-local
    denyStorageClasses:
    - nfs
    - nas
    - efs
    - cephfs
    - glusterfs
    requirePVCVolume: true
    requireSubPathAnchor: true
  rootfsd.yaml: |
    kubeletRoot: /host/var/lib/kubelet
    containerdRunRoot: /host/run/containerd
    containerdStateRoot: /host/var/lib/containerd
    socketDir: /run/persistent-rootfsd
    prepareTimeout: 30s
    resolveTimeout: 30s
    anchorMountRoot: /var/run/rootpv/rootfs-anchor
