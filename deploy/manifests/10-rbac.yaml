apiVersion: v1
kind: ServiceAccount
metadata:
  name: persistent-rootfs-controller
  namespace: rootpv-system
  labels:
    app.kubernetes.io/name: persistent-rootfs
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: rootpv
---
apiVersion: v1
kind: ServiceAccount
