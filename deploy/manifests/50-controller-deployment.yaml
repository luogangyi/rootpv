apiVersion: apps/v1
kind: Deployment
metadata:
  name: persistent-rootfs-controller
  namespace: rootpv-system
  labels:
    app.kubernetes.io/name: persistent-rootfs
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: rootpv
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: persistent-rootfs
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: persistent-rootfs
        app.kubernetes.io/component: controller
        app.kubernetes.io/part-of: rootpv
    spec:
      serviceAccountName: persistent-rootfs-controller
      containers:
      - name: controller
        image: rootpv:latest
        imagePullPolicy: IfNotPresent
        command:
        - /usr/local/bin/persistent-rootfs-controller
        args:
        - --addr=:9443
        - --metrics-addr=:8080
        - --tls-cert-file=/tls/tls.crt
        - --tls-private-key-file=/tls/tls.key
        ports:
        - name: webhook
          containerPort: 9443
          protocol: TCP
        - name: metrics
          containerPort: 8080
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /healthz
            port: metrics
          initialDelaySeconds: 2
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: metrics
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 2
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: config
          mountPath: /etc/persistent-rootfs
          readOnly: true
        - name: webhook-certs
          mountPath: /tls
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: persistent-rootfs-webhook-config
          items:
          - key: runtimeClassMapping.yaml
            path: runtimeClassMapping.yaml
          - key: storagePolicy.yaml
            path: storagePolicy.yaml
      - name: webhook-certs
        secret:
          secretName: persistent-rootfs-webhook-tls
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: persistent-rootfs-controller
  namespace: rootpv-system
  labels:
    app.kubernetes.io/name: persistent-rootfs
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: rootpv
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: persistent-rootfs
      app.kubernetes.io/component: controller
