# Preconditions:
# Manual static-local-PV workflow, independent of configs/example-gvisor.sh.
# 1. Deploy RootPV with the gVisor adapter and wait for persistent-rootfs-gvisor.
#    The source runsc handler needs explicit TypeUrl/ConfigPath and binary_name.
# 2. Replace rootpv-worker-1 with your gVisor node and create the local PV directory.
apiVersion: v1
kind: Namespace
metadata:
  name: rootpv-test-gvisor
  labels:
    openfuyao.cn/rootpv-gvisor-test: "true"
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: rootpv-test-gvisor-pv
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: rootpv-local
  claimRef:
    namespace: rootpv-test-gvisor
    name: rootfs-data
  local:
    path: /var/lib/rootpv/gvisor-test-data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - rootpv-worker-1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rootfs-data
  namespace: rootpv-test-gvisor
spec:
  volumeName: rootpv-test-gvisor-pv
  storageClassName: rootpv-local
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: gvisor-rootpv-test
  namespace: rootpv-test-gvisor
  annotations:
    openfuyao.cn/persistent-rootfs: "true"
    openfuyao.cn/rootfs-container: app
    openfuyao.cn/rootfs-volume: rootfs-data
    openfuyao.cn/rootfs-path: gvisor-test/app
    openfuyao.cn/rootfs-base-image-policy: Strict
spec:
  runtimeClassName: gvisor
  restartPolicy: Never
  terminationGracePeriodSeconds: 5
  nodeSelector:
    kubernetes.io/hostname: rootpv-worker-1
  containers:
    - name: app
      image: nginx:1.21.4
      imagePullPolicy: IfNotPresent
      env:
        - name: ROOTPV_ADAPTER
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['openfuyao.cn/runtime-adapter-id']
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
      command:
        - /bin/sh
        - -ec
        - |
          test "$ROOTPV_ADAPTER" = runsc-v1
          marker=/rootpv-gvisor.marker
          counter=/rootpv-gvisor.boot-count
          if [ ! -f "$marker" ]; then
            printf 'first-pod-uid=%s\n' "$POD_UID" > "$marker"
          fi
          count=0
          if [ -f "$counter" ]; then
            count="$(cat "$counter")"
          fi
          count=$((count + 1))
          printf '%s\n' "$count" > "$counter.tmp"
          mv "$counter.tmp" "$counter"
          if [ ! -f /rootpv-gvisor.payload ]; then
            printf 'persistent-gvisor-payload\n' > /rootpv-gvisor.payload
            chmod 0640 /rootpv-gvisor.payload
            ln -s /rootpv-gvisor.payload /rootpv-gvisor.link
          fi
          sync
          echo "runtime-kernel=$(uname -r)"
          echo "current-pod-uid=$POD_UID"
          cat "$marker"
          echo "persistent-start-count=$count"
          exec sleep 86400
      readinessProbe:
        exec:
          command:
            - /bin/sh
            - -ec
            - test -s /rootpv-gvisor.marker && test -s /rootpv-gvisor.boot-count
        initialDelaySeconds: 1
        periodSeconds: 2
    - name: sidecar
      image: nginx:1.21.4
      imagePullPolicy: IfNotPresent
      command:
        - /bin/sh
        - -ec
        - |
          test ! -e /rootpv-gvisor.marker
          test ! -e /rootpv-sidecar.marker
          printf 'sidecar-ephemeral\n' > /rootpv-sidecar.marker
          echo "sidecar runtime-kernel=$(uname -r)"
          echo "sidecar starts with a fresh root filesystem"
          exec sleep 86400
      readinessProbe:
        exec:
          command:
            - /bin/sh
            - -ec
            - test -s /rootpv-sidecar.marker && test ! -e /rootpv-gvisor.marker
        initialDelaySeconds: 1
        periodSeconds: 2
  # RootPV injects a read-only subPath anchor for app before kubelet starts it.
  volumes:
    - name: rootfs-data
      persistentVolumeClaim:
        claimName: rootfs-data
