# caBundle is intentionally a placeholder because cert-manager is not assumed.
# Patch both webhook clientConfig.caBundle fields with the real serving CA from
# the install script or manually after creating persistent-rootfs-webhook-tls.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: persistent-rootfs-mutating-webhook
  labels:
    app.kubernetes.io/name: persistent-rootfs
    app.kubernetes.io/part-of: rootpv
webhooks:
- name: mpod.persistent-rootfs.ecloud.com
  admissionReviewVersions:
  - v1
  sideEffects: None
  failurePolicy: Fail
  matchPolicy: Equivalent
  timeoutSeconds: 10
  reinvocationPolicy: IfNeeded
  namespaceSelector:
    matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: NotIn
      values:
      - kube-system
      - kube-public
      - kube-node-lease
      - rootpv-system
  objectSelector:
    matchLabels: {}
  rules:
  - apiGroups:
    - ""
    apiVersions:
    - v1
    operations:
    - CREATE
    resources:
    - pods
    scope: Namespaced
  clientConfig:
    service:
      namespace: rootpv-system
      name: persistent-rootfs-webhook
      path: /mutate-v1-pod
      port: 443
    caBundle: Cg==
