apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rootpv.configMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "rootpv.labels" . | nindent 4 }}
data:
  {{- if not .Values.runtimeAdapterDiscovery.enabled }}
  runtimeClassMapping.yaml: |
{{ toYaml .Values.config.runtimeClassMapping | nindent 4 }}
  {{- end }}
  storagePolicy.yaml: |
{{ toYaml .Values.config.storagePolicy | nindent 4 }}
  rootfsd.yaml: |
{{ toYaml .Values.config.rootfsd | nindent 4 }}
