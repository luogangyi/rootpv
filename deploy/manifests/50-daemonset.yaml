apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: persistent-rootfsd
  namespace: rootpv-system
  labels:
    app.kubernetes.io/name: persistent-rootfs
    app.kubernetes.io/component: node-agent
    app.kubernetes.io/part-of: rootpv
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: persistent-rootfs
      app.kubernetes.io/component: node-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: persistent-rootfs
        app.kubernetes.io/component: node-agent
        app.kubernetes.io/part-of: rootpv
    spec:
      serviceAccountName: persistent-rootfs-node
      hostPID: true
      nodeSelector:
        openfuyao.cn/persistent-rootfs: "true"
      tolerations:
      - operator: Exists
      initContainers:
      - name: install-runtime-wrapper
        image: rootpv:latest
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -ec
        - |
          install -d -m 0755 /host/usr/local/bin /host/etc/rootpv
          install -m 0755 /usr/local/bin/rootfs-runtime-wrapper /host/usr/local/bin/rootfs-runtime-wrapper
          install -m 0755 /usr/local/bin/containerd-shim-rootpv-kata-v2 /host/usr/local/bin/containerd-shim-rootpv-kata-v2
          cat >/host/etc/rootpv/rootfs-runtime-wrapper.yaml <<EOF
          rootfsdSocket: /run/persistent-rootfsd/rootfsd.sock
          runtimeRoot: /run/rootpv/rootfs
          overlayMode: flat-lowerdirs
          containerdAddress: /run/containerd/containerd.sock
          containerdNamespace: k8s.io
          allowedOverlaySnapshotRoots:
            - /var/lib/containerd/io.containerd.snapshotter.v1.overlayfs/snapshots
          runtimeAdapterCutover: true
          runtimeAdapterRegistry: /etc/rootpv/rootpv-runtime-adapters.yaml
          EOF
        securityContext:
          privileged: true
        volumeMounts:
        - name: host-usr-local-bin
          mountPath: /host/usr/local/bin
        - name: host-usr-local-sbin
          mountPath: /host/usr/local/sbin
          readOnly: true
        - name: host-etc-rootpv
          mountPath: /host/etc/rootpv
      containers:
      - name: persistent-rootfsd
        image: rootpv:latest
        imagePullPolicy: IfNotPresent
        args:
        - --metrics-addr=:8080
        - --kubelet-root=/var/lib/kubelet
        - --rootfsd-socket=/run/persistent-rootfsd/rootfsd.sock
        - --runtime-root=/run/rootpv/rootfs
        - --runtime-adapter-discovery=true
        - --containerd-config=/host/etc/containerd/config.toml
        - --host-root=/host
        - --runtime-adapter-registry=/host/etc/rootpv/rootpv-runtime-adapters.yaml
        - >-
          --containerd-restart-command=nsenter -t 1 -m -u -i -n -p -- sh -ec 'systemctl restart containerd'
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        ports:
        - name: metrics
          containerPort: 8080
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /healthz
            port: metrics
          initialDelaySeconds: 2
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: metrics
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 2
          failureThreshold: 3
        securityContext:
          privileged: true
          capabilities:
            add:
            - SYS_ADMIN
            - DAC_READ_SEARCH
            - FOWNER
        volumeMounts:
        - name: config
          mountPath: /etc/persistent-rootfs
          readOnly: true
        - name: kubelet
          mountPath: /var/lib/kubelet
          mountPropagation: HostToContainer
        - name: containerd-run
          mountPath: /run/containerd
        - name: containerd-lib
          mountPath: /var/lib/containerd
          mountPropagation: Bidirectional
        - name: rootfsd-run
          mountPath: /run/persistent-rootfsd
          mountPropagation: Bidirectional
        - name: runtime-root
          mountPath: /run/rootpv/rootfs
          mountPropagation: Bidirectional
        - name: containerd-etc
          mountPath: /etc/containerd
        - name: host-root
          mountPath: /host
        - name: host-usr-bin
          mountPath: /host/usr/bin
          readOnly: true
        - name: host-usr-local-bin
          mountPath: /host/usr/local/bin
        - name: host-usr-local-sbin
          mountPath: /host/usr/local/sbin
          readOnly: true
        - name: host-proc
          mountPath: /host/proc
          readOnly: true
        - name: host-sys
          mountPath: /host/sys
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: persistent-rootfs-webhook-config
          items:
          - key: rootfsd.yaml
            path: rootfsd.yaml
          - key: storagePolicy.yaml
            path: storagePolicy.yaml
      - name: kubelet
        hostPath:
          path: /var/lib/kubelet
          type: Directory
      - name: containerd-run
        hostPath:
          path: /run/containerd
          type: Directory
      - name: containerd-lib
        hostPath:
          path: /var/lib/containerd
          type: Directory
      - name: rootfsd-run
        hostPath:
          path: /run/persistent-rootfsd
          type: DirectoryOrCreate
      - name: host-usr-local-bin
        hostPath:
          path: /usr/local/bin
          type: DirectoryOrCreate
      - name: host-usr-local-sbin
        hostPath:
          path: /usr/local/sbin
          type: DirectoryOrCreate
      - name: host-usr-bin
        hostPath:
          path: /usr/bin
          type: Directory
      - name: host-etc-rootpv
        hostPath:
          path: /etc/rootpv
          type: DirectoryOrCreate
      - name: containerd-etc
        hostPath:
          path: /etc/containerd
          type: Directory
      - name: host-proc
        hostPath:
          path: /proc
          type: Directory
      - name: host-sys
        hostPath:
          path: /sys
          type: Directory
      - name: runtime-root
        hostPath:
          path: /run/rootpv/rootfs
          type: DirectoryOrCreate
      - name: host-root
        hostPath:
          path: /
          type: Directory
